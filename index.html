<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Whiskey Bar">
<title>Emmett's Whiskey Bar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: sticky bar (title, search, filters, country jump) over one scrolling list grouped country > region; tap a row for a detail sheet */
  color-scheme: dark;
  --bg:#17110e;         /* charred oak */
  --panel:#231a15;      /* barrel stave */
  --panel-2:#2e231c;
  --line:#44352b;
  --ink:#f1e7d6;        /* label paper */
  --muted:#b3a290;
  --brass:#d7a54a;      /* accent */
  --brass-ink:#1c1408;
  --font-display:"Bodoni Moda","Didot","Bodoni MT",Georgia,serif;
  --font-body:"Figtree","Avenir Next","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:14px 20px 10px}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
h1{font-family:var(--font-display);font-weight:700;font-size:30px;line-height:1.1;margin:0;letter-spacing:.01em;flex:1 1 auto;text-wrap:balance}
h1 span{color:var(--brass)}
.search{flex:1 1 220px;max-width:340px;display:flex}
.search input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:10px 16px;min-height:44px}
.search input::placeholder{color:var(--muted)}
.fbtn{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:0 16px;min-height:44px;font-weight:600}
.fbtn[aria-expanded="true"],.fbtn.on{border-color:var(--brass);color:var(--brass)}
.filters{display:none;padding-top:12px;gap:10px;flex-direction:column}
.filters.open{display:flex}
.frow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.flabel{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);width:96px;flex:none}
.chip{background:transparent;border:1px solid var(--line);border-radius:999px;padding:7px 13px;min-height:38px;font-size:14px;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--brass);border-color:var(--brass);color:var(--brass-ink);font-weight:600}
.clear{background:none;border:none;color:var(--brass);text-decoration:underline;padding:6px 4px;font-size:14px}
.jump{display:flex;gap:8px;overflow-x:auto;padding-top:10px;scrollbar-width:none}
.jump::-webkit-scrollbar{display:none}
.jump button{flex:none;background:none;border:none;border-bottom:2px solid transparent;padding:6px 4px;margin-right:10px;font-size:15px;font-weight:600;color:var(--muted);white-space:nowrap}
.jump button b{font-weight:400;font-variant-numeric:tabular-nums;margin-left:5px;font-size:13px}
.jump button.cur{color:var(--ink);border-color:var(--brass)}
main{padding:6px 20px 80px;max-width:1180px;margin:0 auto}
.count{color:var(--muted);font-size:14px;padding:12px 0 0}
.country{font-family:var(--font-display);font-weight:500;font-size:34px;margin:30px 0 0;line-height:1.1;scroll-margin-top:190px;display:flex;align-items:baseline;gap:12px}
.country small{font-family:var(--font-body);font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.region{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--brass);margin:22px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.region span{color:var(--muted);letter-spacing:.04em;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
.item{text-align:left;background:var(--panel);border:1px solid transparent;border-radius:10px;padding:13px 15px;display:flex;gap:12px;align-items:flex-start;width:100%;min-height:86px}
.item:active{background:var(--panel-2);border-color:var(--line)}
.item .txt{flex:1;min-width:0}
.item .nm{font-weight:600;font-size:16.5px;line-height:1.25;overflow-wrap:anywhere}
.item .sub{color:var(--muted);font-size:14px;margin-top:3px}
.item .tg{color:var(--muted);font-size:13px;margin-top:5px}
.pf{flex:none;text-align:right;font-variant-numeric:tabular-nums;line-height:1.15}
.pf b{display:block;font-family:var(--font-display);font-size:21px;font-weight:500;color:var(--brass)}
.pf i{font-style:normal;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.empty{padding:50px 0;color:var(--muted);text-align:center}
.shade{position:fixed;inset:0;background:rgba(8,5,3,.72);z-index:10;display:none;align-items:center;justify-content:center;padding:20px}
.shade.open{display:flex}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:18px;width:min(720px,100%);max-height:100%;box-shadow:0 20px 60px rgba(0,0,0,.5);overflow-y:auto;padding:22px 24px 30px;position:relative}
.sheet .where{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass);padding-right:54px}
.sheet h2{font-family:var(--font-display);font-weight:700;font-size:30px;line-height:1.12;margin:8px 0 4px;text-wrap:balance;padding-right:40px}
.sheet .by{color:var(--muted);margin:0 0 14px}
.sheet .desc{font-size:18px;line-height:1.5;max-width:60ch;margin:0 0 18px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.tags span{border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:13px}
dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px 20px;margin:0;border-top:1px solid var(--line);padding-top:16px}
dl div.wide{grid-column:1/-1}
dt{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
dd{margin:2px 0 0;font-size:16px}
.x{position:absolute;top:14px;right:14px;width:46px;height:46px;border-radius:50%;background:var(--panel-2);border:1px solid var(--line);font-size:22px;line-height:1}
@media (max-width:560px){h1{font-size:25px}.country{font-size:28px}.flabel{width:100%}.bar,main{padding-left:16px;padding-right:16px}.grid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}

.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:none}
.lang button{background:var(--panel);border:none;min-height:44px;padding:0 14px;font-weight:600;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--brass);color:var(--brass-ink)}
.qr{background:var(--ink);padding:16px;border-radius:12px;width:292px;max-width:100%;margin:8px 0 14px}
.qr img,.qr canvas{display:block;width:100%;height:auto}
.url{color:var(--muted);font-size:14px;overflow-wrap:anywhere;margin:0}
</style>
</head>
<body>

    <h1>Emmett's <span>Whiskey</span> Bar</h1>
    <label class="search"><input id="q" type="search" autocomplete="off"></label>

</div>
<main>

</main>

  document.getElementById("count").textContent = rows.length===D.length ? t.all(D.length) : t.some(rows.length,D.length);
  CORDER.forEach(function(c){
    var cr=rows.filter(function(w){return w.country===c;}); if(!cr.length) return;
    jump+='<button data-c="'+esc(c)+'">'+esc(cname(c))+'<b>'+cr.length+'</b></button>';
    html+='<h2 class="country" id="c-'+esc(c)+'">'+esc(cname(c))+' <small>'+cr.length+'</small></h2>';
    var regs={}; cr.forEach(function(w){(regs[w.region]=regs[w.region]||[]).push(w);});
    Object.keys(regs).sort(function(a,b){a=rkey(c,a);b=rkey(c,b);return a<b?-1:a>b?1:0;}).forEach(function(r){
      var ws=regs[r].sort(function(a,b){return a.name.toLowerCase()<b.name.toLowerCase()?-1:1;});
      if(!(Object.keys(regs).length===1 && r===c)) html+='<div class="region">'+esc(L(ws[0],"region"))+'<span>'+ws.length+'</span></div>';
      else html+='<div class="region" style="border:none;margin:6px 0 4px"></div>';
      html+='<div class="grid">';
      ws.forEach(function(w){
        var sub=[L(w,"style")]; if(w.age && w.age!=="NAS" && w.age.length<22) sub.push(L(w,"age"));
        var tg=(L(w,"tags")||"").split(",").slice(0,3).map(function(x){return x.trim();}).join(" · ");
        html+='<button class="item" data-i="'+w.i+'"><span class="txt"><span class="nm">'+esc(w.name)+'</span><div class="sub">'+esc(sub.join(" · "))+'</div><div class="tg">'+esc(tg)+'</div></span><span class="pf"><b>'+num(lang==="de"?w.proof/2:w.proof)+'</b><i>'+t.unit+'</i></span></button>';
      });
      html+='</div>';
    });
  });
  if(!rows.length) html='<p class="empty">'+esc(t.empty)+'</p>';
  document.getElementById("list").innerHTML=html;
  document.getElementById("jump").innerHTML=jump;
}
var openW=null;
function show(h){var s=document.getElementById("sheet"); s.innerHTML='<button class="x" id="x" aria-label="'+esc(T[lang].close)+'">×</button>'+h; s.scrollTop=0; document.getElementById("shade").classList.add("open"); document.body.style.overflow="hidden"; document.getElementById("x").focus();}
function open(w){
  openW=w; var t=T[lang];
  var age = w.age==="NAS" ? t.nas : L(w,"age");
  var str = lang==="de" ? num(w.proof/2)+" % vol ("+num(w.proof)+" Proof)" : num(w.proof)+" proof ("+num(w.proof/2)+"% ABV)";
  var reg = L(w,"region");
  show('<div class="where">'+esc(cname(w.country))+(w.region && w.region!==w.country?' · '+esc(reg):'')+'</div>'
   +'<h2 id="d-name">'+esc(w.name)+'</h2><p class="by">'+esc(L(w,"producer"))+'</p>'
   +'<p class="desc">'+esc(L(w,"desc"))+'</p>'
   +'<div class="tags">'+(L(w,"tags")||"").split(",").map(function(x){return '<span>'+esc(x.trim())+'</span>';}).join("")+'</div>'
   +'<dl><div><dt>'+t.style+'</dt><dd>'+esc(L(w,"style"))+'</dd></div><div><dt>'+t.age+'</dt><dd>'+esc(age)+'</dd></div>'
   +'<div><dt>'+t.strength+'</dt><dd>'+str+'</dd></div><div><dt>'+t.bottle+'</dt><dd>'+esc(w.size)+' ml</dd></div>'
   +'<div class="wide"><dt>'+t.cask+'</dt><dd>'+esc(L(w,"cask"))+'</dd></div><div class="wide"><dt>'+esc(t.mash)+'</dt><dd>'+esc(L(w,"mash"))+'</dd></div></dl>');
}
function menuUrl(){ var h=location.hostname||""; if(location.protocol.indexOf("http")!==0 || /claude|anthropic|localhost/.test(h)) return MENU_URL; return location.origin+location.pathname; }
function qr(){
  openW="qr"; var t=T[lang], u=menuUrl();
  show('<h2 id="d-name">'+esc(t.qrTitle)+'</h2><p class="by">'+esc(t.qrText)+'</p><div class="qr" id="qrbox"></div><p class="url">'+esc(u)+'</p>');
  try{ new QRCode(document.getElementById("qrbox"),{text:u,width:260,height:260,colorDark:"#17110e",colorLight:"#f1e7d6"}); }
  catch(e){ document.getElementById("qrbox").textContent=t.qrFail; }
}
function close(){openW=null;document.getElementById("shade").classList.remove("open");document.body.style.overflow="";}
function setLang(l){ lang=l; try{localStorage.setItem("ewb-lang",l);}catch(e){} chrome(); render(); if(openW==="qr") qr(); else if(openW) open(openW); }
document.getElementById("l-en").onclick=function(){setLang("en");}; document.getElementById("l-de").onclick=function(){setLang("de");};
document.getElementById("qrbtn").onclick=qr;
document.getElementById("list").addEventListener("click",function(e){var b=e.target.closest(".item"); if(b) open(D[+b.getAttribute("data-i")]);});
document.getElementById("shade").addEventListener("click",function(e){if(e.target.id==="shade"||e.target.id==="x") close();});
document.addEventListener("keydown",function(e){if(e.key==="Escape") close();});
document.getElementById("jump").addEventListener("click",function(e){var b=e.target.closest("button"); if(!b) return; var el=document.getElementById("c-"+b.getAttribute("data-c")); if(el){var y=el.getBoundingClientRect().top+window.pageYOffset-document.getElementById("bar").offsetHeight-8; window.scrollTo(0,y);}});
document.getElementById("q").addEventListener("input",function(e){st.q=e.target.value.trim().toLowerCase();render();});
document.getElementById("fbtn").addEventListener("click",function(){var f=document.getElementById("filters");var o=f.classList.toggle("open");this.setAttribute("aria-expanded",o?"true":"false");});
document.getElementById("clear").addEventListener("click",function(){st.style={};st.tag={};st.proof={};st.q="";document.getElementById("q").value="";chrome();render();});
var tick=false; window.addEventListener("scroll",function(){ if(tick) return; tick=true; requestAnimationFrame(function(){ tick=false; var bh=document.getElementById("bar").offsetHeight+20, cur=null; [].forEach.call(document.querySelectorAll(".country"),function(h){ if(h.getBoundingClientRect().top<=bh) cur=h.id.slice(2); }); [].forEach.call(document.querySelectorAll("#jump button"),function(b){ b.classList.toggle("cur", b.getAttribute("data-c")===cur); }); }); },{passive:true});
chrome(); render();
})();
</script>
</body>
</html>
